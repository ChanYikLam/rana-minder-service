  <g id="PB-REC-07" aria-label="P-REC-07 招新公开目录低保真画板">
    <rect x="20" y="225" width="2360" height="362" rx="10" class="board"/>
    <text x="42" y="256" class="boardTitle">P-REC-07 · 招新公开目录</text>
    <text x="360" y="256" class="micro">画板 PB-REC-07　变体：找社团、找活动</text>
    <g id="PB-REC-07-D" aria-label="主低保真帧">
      <rect x="40" y="277" width="900" height="288" rx="8" class="frame"/>
      <rect x="60" y="291" width="860" height="34" rx="5" class="chrome"/>
<text x="76" y="314" class="micro">全局导航　/　招新公开目录　　作用域：按当前用户与对象回源</text>
<rect x="76" y="346" width="828" height="38" rx="5" class="ghost"/>
<rect x="76" y="399" width="828" height="34" rx="4" class="ghost"/>
<rect x="76" y="444" width="828" height="34" rx="4" class="ghost"/>
<rect x="76" y="489" width="828" height="34" rx="4" class="ghost"/>
<text x="78" y="555" class="micro">筛选栏 · 状态摘要 · 数据列表/卡片 · 分页 · 详情抽屉</text>
      <text x="82" y="336" class="overlay"><tspan x="82" dy="0">正常态：展示找社团/找活动、搜索筛选和历</tspan><tspan x="82" dy="21">史入口</tspan></text>
      <text x="82" y="408" class="overlay"><tspan x="82" dy="0">响应式：筛选收纳为抽屉；</tspan><tspan x="82" dy="21">数据行转卡片；</tspan><tspan x="82" dy="21">行级动作与状态原因必须保留。</tspan></text>
      <text x="462" y="408" class="overlay"><tspan x="462" dy="0">授权收口：页面公开；</tspan><tspan x="462" dy="21">业务写入口未登录时转登录</tspan></text>
    </g><g id="EV-REC-07-N" aria-label="P-REC-07 正常状态">
      <rect x="960" y="277" width="270" height="288" rx="8" class="state stateN"/>
      <text x="976" y="307" class="stateTitle">N · 正常</text>
      <text x="976" y="337" class="stateBody"><tspan x="976" dy="0">展示找社团/找活动、搜索筛选</tspan><tspan x="976" dy="22">和历史入口</tspan></text>
    </g><g id="EV-REC-07-L" aria-label="P-REC-07 加载状态">
      <rect x="1240" y="277" width="270" height="288" rx="8" class="state stateL"/>
      <text x="1256" y="307" class="stateTitle">L · 加载</text>
      <text x="1256" y="337" class="stateBody"><tspan x="1256" dy="0">查询或分页时保留条件并显示骨</tspan><tspan x="1256" dy="22">架</tspan></text>
    </g><g id="EV-REC-07-E" aria-label="P-REC-07 空数据状态">
      <rect x="1520" y="277" width="270" height="288" rx="8" class="state stateE"/>
      <text x="1536" y="307" class="stateTitle">E · 空数据</text>
      <text x="1536" y="337" class="stateBody"><tspan x="1536" dy="0">无公开结果或筛选无命中时区分</tspan><tspan x="1536" dy="22">空态</tspan></text>
    </g><g id="EV-REC-07-F" aria-label="P-REC-07 失败状态">
      <rect x="1800" y="277" width="270" height="288" rx="8" class="state stateF"/>
      <text x="1816" y="307" class="stateTitle">F · 失败</text>
      <text x="1816" y="337" class="stateBody"><tspan x="1816" dy="0">搜索查询失败提供重试，不退化</tspan><tspan x="1816" dy="22">为“无结果”</tspan></text>
    </g><g id="EV-REC-07-A" aria-label="P-REC-07 无权限状态">
      <rect x="2080" y="277" width="270" height="288" rx="8" class="state stateA"/>
      <text x="2096" y="307" class="stateTitle">A · 无权限</text>
      <text x="2096" y="337" class="stateBody"><tspan x="2096" dy="0">页面公开；</tspan><tspan x="2096" dy="22">业务写入口未登录时转登录</tspan></text>
    </g></g>
  <text x="40" y="666" class="micro">正式低保真设计基线：用于状态与交互评审；外部高保真/移动视觉不得改变业务、授权与安全边界；代码开工门关闭。</text>
