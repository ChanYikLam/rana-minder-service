openapi: 3.0.3
info:
  title: RanaMinder 后端 API
  version: dev
  description: |-
    高校学生社团人员管理系统 · 后端 HTTP 接口（NestJS）。

    ## 通用约定
    - 成功响应统一信封 `ApiSuccess`：`{ "code": 0, "data": ... }`，`code` 恒为 0。
    - 失败响应统一 `ApiError`：仅含 `code/message/supportId/fieldErrors`（IFC-ERR-001~017）。
    - POST/PUT/DELETE 请求体统一信封 `ApiRequestEnvelope`：顶层仅 `action/targetId/expectedVersion/idempotencyKey/input` 五键，业务字段位于 `input` 内。
    - 文件上传例外：`POST /api/files/upload` 为 FormData 直传，无信封。
    - 认证：除公开端点外均需 `Authorization: Bearer <token>`（会话令牌）。
    - 权威契约：`docs/specification/接口清单-HTTP端点-v1.0.md`、`docs/specification/接口契约-v1.0.md`。
    - 本文件由 `node scripts/generate-openapi.js` 生成，勿手工编辑。
servers:
  - url: http://localhost:3000
    description: 本地开发环境
  - url: http://localhost:8080
    description: Docker 开发环境（docker-compose.dev.yml）
