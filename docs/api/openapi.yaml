components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "登录后由 /api/auth/session 建立会话，请求头携带 Authorization: Bearer <token>。"
  schemas:
    ApiSuccess:
      type: object
      description: 统一成功响应信封（code 恒为 0）
      required:
        - code
        - data
      properties:
        code:
          type: integer
          const: 0
        data:
          description: 业务数据（各端点返回结构不同）
    ApiError:
      type: object
      description: 统一失败响应信封（API-GEN-004/005），仅允许以下字段
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 错误码 IFC-ERR-001~017
        message:
          type: string
          description: 脱敏后的错误信息
        supportId:
          type: string
          description: 支持编号（用于日志定位）
        fieldErrors:
          type: array
          description: 字段级校验错误（可选）
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    ApiRequestEnvelope:
      type: object
      description: 统一请求信封（API-GEN-003）：顶层仅五键，业务字段位于 input 内
      properties:
        action:
          type: string
          description: 可选，业务动作标识
        targetId:
          type: string
          description: 可选，目标对象稳定标识（服务端回源验证）
        expectedVersion:
          type: number
          description: 可选，乐观锁期望版本（不匹配 → 409 IFC-ERR-008）
        idempotencyKey:
          type: string
          description: 可选，业务幂等键（同键异参 → 409 IFC-ERR-009）
        input:
          description: 业务字段（只读）
    EmailConfigInput:
      type: object
      properties:
        smtpHost:
          type: string
        smtpPort:
          type: number
        smtpUser:
          type: string
        fromName:
          type: string
        encryption:
          type: string
          enum:
            - ssl
            - tls
            - none
        smtpSecret:
          type: string
          description: 发信密钥（写-only，NTF-006）：只能重填或轮换，服务端加密落库，
      required:
        - smtpHost
        - smtpUser
        - fromName
    EmailTemplateSaveInput:
      type: object
      properties:
        subject:
          type: string
        htmlBody:
          type: string
      required:
        - subject
        - htmlBody
    ExportApplyBody:
      type: object
      properties:
        kind:
          type: string
          enum:
            - club
            - department
            - platform
            - joint
            - personal
        clubId:
          type: string
        departmentId:
          type: string
        jointActivityId:
          type: string
        targetUserId:
          type: string
        datasets: {}
        fields:
          type: object
          additionalProperties: {}
        academicYear:
          type: string
        timeRange:
          type: object
          properties:
            from:
              type: string
            to:
              type: string
          required:
            - from
            - to
        includeFiles:
          type: boolean
        includeContact:
          type: boolean
          description: 联系方式（phone/email）显式勾选（5.4.3，EXP-002/EXP-003）。
        purpose:
          type: string
          description: 超管特权导出用途（必填）
        reauthProofAt:
          type: string
        idempotencyKey:
          type: string
      required:
        - kind
    FileCategory:
      type: string
      enum:
        - PHOTO
        - VIDEO
        - GENERIC
    FileUploadBodyVo:
      type: object
      properties:
        name:
          type: string
          description: 原始文件名（仅登记，不进入对象键；领域不持久化，见汇报“无法映射项”）
        category:
          $ref: "#/components/schemas/FileCategory"
          description: 业务类别（PHOTO/VIDEO/GENERIC）
        size:
          type: number
          description: 声明大小（字节）
        mimeType:
          type: string
          description: 声明 MIME 类型（不信任，仅登记）
        bytes:
          type: string
          format: binary
          description: 二进制数据（JSON 序列化为 base64，上传场景为 FormData 文件流）
        scope:
          type: object
          properties:
            kind:
              type: string
            clubId:
              type: string
            unionId:
              type: string
            subjectId:
              type: string
          required:
            - kind
          description: 创建作用域（社团/联合域/主体）
        target:
          type: object
          properties:
            objectType:
              type: string
            objectId:
              type: string
            fieldKey:
              type: string
          required:
            - objectType
            - objectId
            - fieldKey
          description: 目标草稿/纠错对象与字段
        sessionTtlMinutes:
          type: number
          description: 上传会话有效期（分钟；默认 30）
      required:
        - name
        - category
        - size
        - bytes
    NotificationKillSwitchInput:
      type: object
      properties:
        active:
          type: boolean
        reason:
          type: string
        expectedRecoveryAt:
          type: string
          description: 预计恢复时间（关闭时必须设置）
        confirmed:
          type: boolean
          description: 二次确认（关闭时必须为 true）
        operatorName:
          type: string
          description: 操作者展示名称
      required:
        - active
    RawBody:
      anyOf:
        - type: object
          additionalProperties: {}
        - nullable: true
  responses:
    BadRequest:
      description: 请求体解析失败 / 参数校验失败（IFC-ERR-017 等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: 未认证或会话失效（IFC-ERR-001/002）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: 无权限（IFC-ERR-003/004/011）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 资源不存在（IFC-ERR-015）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 状态冲突 / 幂等冲突 / 版本不匹配（IFC-ERR-007~010）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unprocessable:
      description: 业务校验失败（IFC-ERR-005/006）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: 服务异常（IFC-ERR-016）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
