# ------------------------------------------------------------
# 发布 Tag（v*）：tag_push 为仓库级事件置于兜底分支，经 v* 守卫仅对版本标签生效
# ------------------------------------------------------------
"$":
  tag_push:
    - name: release-check
      docker:
        image: node:24
      services:
        - docker
      stages:
        - name: 9-秘密扫描
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: |
            set -e
            if ! command -v gitleaks >/dev/null 2>&1; then
              curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
              tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
            fi
            gitleaks detect --source . --no-banner --redact --config .gitleaks.toml
        - name: 11-文档链接一致性
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: |
            bash scripts/ci/check-docs-links.sh
        - name: 1-安装
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: |
            # 通过 corepack 使用与 package.json packageManager 匹配的 pnpm 版本
            corepack pnpm install --frozen-lockfile
        - name: 2-类型检查
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run typecheck
        - name: 3-Lint
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run lint
        - name: 3-格式
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run format:check
        - name: 4-单元测试L1
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run test:unit
        # 阶段 4b：覆盖率统计与门禁（P1-A/CI-001：行/分支覆盖率证据 + 阈值门禁 + 改动文件↔用例对应）
        - name: 4b-覆盖率门禁
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: |
            set -e
            npm run test:cov:gate
            bash scripts/ci/check-spec-coverage.sh "$CNB_COMMIT~1"
        - name: 5-集成测试L2
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: |
            set -e
            docker run -d --name pg18-ci \
              -e POSTGRES_PASSWORD=ci \
              -e POSTGRES_DB=ranaminder_test \
              -p 5432:5432 \
              postgres:18-alpine
            trap 'docker rm -f pg18-ci >/dev/null 2>&1 || true' EXIT
            for i in $(seq 1 30); do
              if docker exec pg18-ci pg_isready -U postgres -d ranaminder_test >/dev/null 2>&1; then
                break
              fi
              sleep 2
              if [ "$i" = 30 ]; then
                echo "PG18 未在预期时间内就绪，容器日志："
                docker logs pg18-ci
                exit 1
              fi
            done
            docker exec pg18-ci psql -U postgres -d ranaminder_test -v ON_ERROR_STOP=1 \
              -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS btree_gist;'
            # 应用经 TCP 连接 DB：pg 容器以 -p 5432:5432 发布端口，dind 下
            # job 容器共享 daemon 网络命名空间，经 127.0.0.1 即可访问（CNB 官方
            # docker 服务连接数据库推荐口径；容器桥接 IP 在 dind 下并不可达）。
            export DATABASE_HOST=127.0.0.1 DATABASE_PORT=5432 DATABASE_NAME=ranaminder_test \
              DATABASE_USER=postgres DATABASE_PASSWORD=ci DATABASE_SSL=false
            export CI=true
            npm run test:integration
        - name: 6-契约测试L3
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run test:contract
        - name: 7-构建
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: |
            npm run build
            npm run build:worker
        # 阶段 8：镜像构建（Tag 即版本号，非 latest）；推送移至阶段 8e（扫描/SBOM 通过后才 push，
        # 确保发布门在危险镜像进入制品库前拦截，避免“先 push 后扫描”使门禁落空）
        - name: 8-镜像构建
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ] && [ -f Dockerfile ]'
          script: |
            docker build -t ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_BRANCH} .
        # 阶段 8b：发布镜像安全扫描（trivy；HIGH/CRITICAL 失败即阻断发布，DEP-003 / SRS-NFR-022/023 / OPS-REL）
        # 运行镜像已移除基础镜像自带 npm 与 corepack（及 pnpm 缓存，见 DOCK-021 注 5）；
        # 此处 --skip-dirs 仅作双重保险（DEP-Q-003：基础镜像工具链 CVE 由镜像维护，不进入应用依赖门禁）
        - name: 8b-镜像安全扫描
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ] && [ -f Dockerfile ]'
          script: |
            set -e
            if ! (command -v trivy >/dev/null 2>&1 && trivy --version 2>&1 | grep -q '0.69.3'); then
              curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz -o /tmp/trivy.tar.gz
              echo "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75  /tmp/trivy.tar.gz" | sha256sum -c -
              tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
              rm -f /tmp/trivy.tar.gz
            fi
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --skip-dirs /usr/local/lib/node_modules/npm,/usr/local/lib/node_modules/corepack,/root/.cache/node/corepack \
              ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_BRANCH}
        # 阶段 8c：发布镜像 SBOM 生成（DEP-003 第三方依赖/许可证清单，发布门证据归档）
        - name: 8c-镜像SBOM生成
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ] && [ -f Dockerfile ]'
          script: |
            set -e
            if ! (command -v syft >/dev/null 2>&1 && syft --version 2>&1 | grep -q '1.51.0'); then
              curl -sSfL https://github.com/anchore/syft/releases/download/v1.51.0/syft_1.51.0_linux_amd64.tar.gz -o /tmp/syft.tar.gz
              echo "2a2e837a2c8d59ec9af5472ee22d3b04ee463c4e44476ecf993fd1e5ab6ebc7f  /tmp/syft.tar.gz" | sha256sum -c -
              tar -xzf /tmp/syft.tar.gz -C /usr/local/bin syft
              rm -f /tmp/syft.tar.gz
            fi
            syft ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_BRANCH} -o spdx-json > /tmp/ranaminder-sbom.spdx.json
            echo "发布镜像 SBOM 已生成（spdx-json），作为第三方依赖/许可证清单证据归档，供发布门复核。"
            wc -c /tmp/ranaminder-sbom.spdx.json
            # 复制到工作目录，供阶段 8d 归档到附件（发布门证据可追溯）
            mkdir -p artifacts && cp /tmp/ranaminder-sbom.spdx.json artifacts/ranaminder-sbom.spdx.json
        # 阶段 8d：归档 SBOM 到 commit 附件（DEP-003 发布门证据持久化，供人工门复核）
        # 上传到当前 commit 附件，不依赖 release 是否存在；文件在构建容器销毁后仍可追溯
        # 8d 使用固定版本 attachments 插件镜像 v1.1.4，避免 :latest 不可复现的供应链风险（同 trivy/syft 固定版本；v1.1.4 与 latest 为不同 digest，按固定版本拉取）
        - name: 8d-归档SBOM证据
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ] && [ -f Dockerfile ]'
          image: cnbcool/attachments:v1.1.4
          settings:
            commit: $CNB_COMMIT
            attachments:
              - "./artifacts/ranaminder-sbom.spdx.json"
        # 阶段 8e：推送发布镜像（仅在前序 8b 扫描、8c SBOM、8d 归档均成功后执行）
        # 危险镜像不会进入制品库；扫描失败时流水线在此前中断，实现真正的“扫描失败阻断发布”
        - name: 8e-镜像推送
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ] && [ -f Dockerfile ]'
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_BRANCH}
        - name: 10-依赖审计与许可证登记
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f pnpm-lock.yaml ]'
          script: |
            # 通过 corepack 使用与 package.json packageManager 匹配的 pnpm 版本（同阶段 1）
            corepack pnpm audit --audit-level=high
            bash scripts/ci/check-license-registry.sh
      endStages:
        # 发布门证据摘要（CI-004）：人工门由治理流程控制，CI 只输出证据供归档
        - name: 发布门证据摘要
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: |
            echo "=== 发布门证据（CI-004）==="
            echo "1) 首批技术验证清单 38 项（TVER-*）：人工门，见 docs/engineering/首批技术验证清单-v1.0.md"
            echo "2) 测试规格执行（306 转换底线、TST-FAIL/NFR/SEC）：人工门，见 docs/specification/测试规格与验收追踪-v1.0.md"
            echo "3) OPS-VER-001~024 部署/升级/恢复演练：人工门，见 docs/operations/部署运维与恢复手册-v1.0.md"
            echo "4) 生产 DDL 与迁移评审：人工门"
            echo "5) 秘密扫描/依赖审计/许可证：本流水线已执行（上方阶段日志即证据）"
            echo "6) 镜像与版本锁定（非 latest）：本流水线已执行（阶段 8 构建、阶段 8e 推送日志即证据）"
            echo "7) 镜像安全扫描（trivy HIGH/CRITICAL 失败门）：本流水线已执行且先于推送（阶段 8b 日志即证据）"
            echo "8) 镜像 SBOM（第三方依赖/许可证清单，DEP-003）：本流水线已生成并归档（阶段 8c 日志与 8d 附件即证据）"
