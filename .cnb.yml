# ============================================================
# RanaMinder Service · CI 流水线配置（cnb.cool 云原生构建）
#
# 权威依据：docs/engineering/CI与质量门定义-v1.0.md（CI-001~CI-006）
# 阶段 -> 实现 -> 门禁的完整映射与维护说明见：
#   docs/engineering/CI流水线落地指南-v1.0.md
# 语法参考：https://docs.cnb.cool/zh/build/grammar.md
#
# 结构概览：
#   (main|dev).pull_request / push：
#     - docs-check：任何变更都执行（秘密扫描 + 文档链接一致性）
#     - code-check：仅代码相关变更执行（CI-001 阶段 1~8、10；代码未开工时自动跳过）
#   "$".tag_push（tag_push 为仓库级事件置于兜底分支，经 v* 守卫仅对版本标签生效）：
#     - release-check：全量阶段 + 发布门证据摘要（CI-002 规则 3、CI-004）
#
# 代码阶段保护：代码阶段以 package.json 存在为前提（阶段 8 另需 Dockerfile），
# 仓库无 package.json 时全部自动跳过；阶段 1 在 package.json 出现后执行
# corepack pnpm install --frozen-lockfile，锁文件缺失/漂移即失败。
# 包管理器为 pnpm（package.json 声明 packageManager: pnpm，锁文件为 pnpm-lock.yaml）。
# ============================================================

# ------------------------------------------------------------
# main / dev 分支：MR 与推送
# ------------------------------------------------------------
"(main|dev)":
  # ---- MR（含推送更新）：全量门禁（CI-001、CI-002 规则 1）----
  pull_request:
    # 文档检查：任何变更都执行；纯文档变更（docs/**、*.md）时，
    # 本流水线是唯一执行者（CI-002 规则 2：保留阶段 9 与 11）
    - name: docs-check
      docker:
        image: node:24
      stages:
        # 阶段 9：秘密扫描（gitleaks，0 命中）
        - name: 9-秘密扫描
          script: |
            set -e
            if ! command -v gitleaks >/dev/null 2>&1; then
              curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
              tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
            fi
            gitleaks detect --source . --no-banner --redact
        # 阶段 11：文档一致性（相对链接检查）
        - name: 11-文档链接一致性
          script: |
            bash scripts/ci/check-docs-links.sh

    # 代码质量门：仅代码相关变更执行（src/、test/、构建配置、.cnb.yml 等）
    - name: code-check
      docker:
        image: node:24
      services:
        - docker
      ifModify:
        - "**"
        - "!(docs/**)"
        - "!(**/*.md)"
        - "!*.md"
        - "!(scripts/ci/**)"
      stages:
        # 阶段 1：安装（pnpm 锁文件驱动；package.json 出现后 pnpm-lock.yaml 缺失/漂移即失败）
        - name: 1-安装
          if: "[ -f package.json ]"
          script: |
            # 通过 corepack 使用与 package.json packageManager 匹配的 pnpm 版本
            corepack pnpm install --frozen-lockfile
        # 阶段 2：类型检查
        - name: 2-类型检查
          if: "[ -f package.json ]"
          script: npm run typecheck
        # 阶段 3：Lint（独立阶段，便于 CI 日志定位 lint 问题）
        - name: 3-Lint
          if: "[ -f package.json ]"
          script: npm run lint
        # 阶段 3b：格式检查（独立阶段，prettier 失败信息不再被 eslint 输出淹没）
        - name: 3-格式
          if: "[ -f package.json ]"
          script: npm run format:check
        # 阶段 4：单元测试 L1（领域规则，覆盖率新增代码须有对应用例）
        - name: 4-单元测试L1
          if: "[ -f package.json ]"
          script: npm run test:unit
        # 阶段 5：集成测试 L2（真实 PG18：pg_trgm/btree_gist 扩展；dind 已声明）
        - name: 5-集成测试L2
          if: "[ -f package.json ]"
          script: |
            set -e
            # 启动真实 PG18 测试容器（应用连接信息由 package.json 的 test:integration 脚本传入）
            docker run -d --name pg18-ci \
              -e POSTGRES_PASSWORD=ci \
              -e POSTGRES_DB=ranaminder_test \
              -p 5432:5432 \
              postgres:18
            trap 'docker rm -f pg18-ci >/dev/null 2>&1 || true' EXIT
            # 等待 PG18 就绪（最长约 60 秒）
            for i in $(seq 1 30); do
              if docker exec pg18-ci pg_isready -U postgres -d ranaminder_test >/dev/null 2>&1; then
                break
              fi
              sleep 2
              if [ "$i" = 30 ]; then
                echo "PG18 未在预期时间内就绪，容器日志："
                docker logs pg18-ci
                exit 1
              fi
            done
            # 与开发环境 scripts/dev/postgres-init.sql 保持一致的扩展初始化
            docker exec pg18-ci psql -U postgres -d ranaminder_test -v ON_ERROR_STOP=1 \
              -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS btree_gist;'
            export CI=true
            npm run test:integration
        # 阶段 6：契约测试 L3（HTTP 级：信封/错误码/分页/幂等/脱敏）
        - name: 6-契约测试L3
          if: "[ -f package.json ]"
          script: npm run test:contract
        # 阶段 7：构建（HTTP 应用 + Worker 双入口，ADR-001/ADR-013）
        - name: 7-构建
          if: "[ -f package.json ]"
          script: |
            npm run build
            npm run build:worker
        # 阶段 8：镜像构建（tag 非 latest）
        - name: 8-镜像构建
          if: "[ -f package.json ] && [ -f Dockerfile ]"
          script: |
            docker build -t ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_COMMIT_SHORT} .
        # 阶段 8b：镜像安全扫描（trivy；HIGH/CRITICAL 为失败门，DEP-003 / SRS-NFR-022/023）
        - name: 8b-镜像安全扫描
          if: "[ -f package.json ] && [ -f Dockerfile ]"
          script: |
            set -e
            if ! command -v trivy >/dev/null 2>&1; then
              curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
            fi
            # 扫描已构建镜像；HIGH/CRITICAL 漏洞使扫描失败（镜像层、OS 包、应用依赖）
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_COMMIT_SHORT}
        # 阶段 8c：镜像 SBOM 生成与复核（DEP-003 第三方依赖清单，供发布归档）
        - name: 8c-镜像SBOM与许可证复核
          if: "[ -f package.json ] && [ -f Dockerfile ]"
          script: |
            set -e
            if ! command -v syft >/dev/null 2>&1; then
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | bash -s -- -b /usr/local/bin
            fi
            # 生成镜像 SBOM 并输出（发布门证据归档用，不推送产物）
            syft ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_COMMIT_SHORT} -o spdx-json > /tmp/ranaminder-sbom.spdx.json
            echo "镜像 SBOM 已生成（spdx-json），许可证复核见阶段 10 与发布门证据摘要。"
            wc -c /tmp/ranaminder-sbom.spdx.json
        # 阶段 10：依赖审计与许可证登记（DEP-003）
        - name: 10-依赖审计与许可证登记
          if: "[ -f pnpm-lock.yaml ]"
          script: |
            # 通过 corepack 使用与 package.json packageManager 匹配的 pnpm 版本（同阶段 1）
            corepack pnpm audit --audit-level=high
            bash scripts/ci/check-license-registry.sh

  # ---- push（合并后回归验证；策略与 MR 相同）----
  push:
    - name: docs-check
      docker:
        image: node:24
      stages:
        - name: 9-秘密扫描
          script: |
            set -e
            if ! command -v gitleaks >/dev/null 2>&1; then
              curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
              tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
            fi
            gitleaks detect --source . --no-banner --redact
        - name: 11-文档链接一致性
          script: |
            bash scripts/ci/check-docs-links.sh
    - name: code-check
      docker:
        image: node:24
      services:
        - docker
      ifModify:
        - "**"
        - "!(docs/**)"
        - "!(**/*.md)"
        - "!*.md"
        - "!(scripts/ci/**)"
      stages:
        - name: 1-安装
          if: "[ -f package.json ]"
          script: |
            # 通过 corepack 使用与 package.json packageManager 匹配的 pnpm 版本
            corepack pnpm install --frozen-lockfile
        - name: 2-类型检查
          if: "[ -f package.json ]"
          script: npm run typecheck
        - name: 3-Lint
          if: "[ -f package.json ]"
          script: npm run lint
        - name: 3-格式
          if: "[ -f package.json ]"
          script: npm run format:check
        - name: 4-单元测试L1
          if: "[ -f package.json ]"
          script: npm run test:unit
        - name: 5-集成测试L2
          if: "[ -f package.json ]"
          script: |
            set -e
            docker run -d --name pg18-ci \
              -e POSTGRES_PASSWORD=ci \
              -e POSTGRES_DB=ranaminder_test \
              -p 5432:5432 \
              postgres:18
            trap 'docker rm -f pg18-ci >/dev/null 2>&1 || true' EXIT
            for i in $(seq 1 30); do
              if docker exec pg18-ci pg_isready -U postgres -d ranaminder_test >/dev/null 2>&1; then
                break
              fi
              sleep 2
              if [ "$i" = 30 ]; then
                echo "PG18 未在预期时间内就绪，容器日志："
                docker logs pg18-ci
                exit 1
              fi
            done
            docker exec pg18-ci psql -U postgres -d ranaminder_test -v ON_ERROR_STOP=1 \
              -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS btree_gist;'
            export CI=true
            npm run test:integration
        - name: 6-契约测试L3
          if: "[ -f package.json ]"
          script: npm run test:contract
        - name: 7-构建
          if: "[ -f package.json ]"
          script: |
            npm run build
            npm run build:worker
        - name: 8-镜像构建
          if: "[ -f package.json ] && [ -f Dockerfile ]"
          script: |
            docker build -t ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_COMMIT_SHORT} .
        # 阶段 8b：镜像安全扫描（trivy；HIGH/CRITICAL 为失败门，DEP-003 / SRS-NFR-022/023）
        - name: 8b-镜像安全扫描
          if: "[ -f package.json ] && [ -f Dockerfile ]"
          script: |
            set -e
            if ! command -v trivy >/dev/null 2>&1; then
              curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
            fi
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_COMMIT_SHORT}
        # 阶段 8c：镜像 SBOM 生成与复核（DEP-003 第三方依赖清单，供发布归档）
        - name: 8c-镜像SBOM与许可证复核
          if: "[ -f package.json ] && [ -f Dockerfile ]"
          script: |
            set -e
            if ! command -v syft >/dev/null 2>&1; then
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | bash -s -- -b /usr/local/bin
            fi
            syft ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_COMMIT_SHORT} -o spdx-json > /tmp/ranaminder-sbom.spdx.json
            echo "镜像 SBOM 已生成（spdx-json），许可证复核见阶段 10 与发布门证据摘要。"
            wc -c /tmp/ranaminder-sbom.spdx.json
        - name: 10-依赖审计与许可证登记
          if: "[ -f pnpm-lock.yaml ]"
          script: |
            # 通过 corepack 使用与 package.json packageManager 匹配的 pnpm 版本（同阶段 1）
            corepack pnpm audit --audit-level=high
            bash scripts/ci/check-license-registry.sh

# ------------------------------------------------------------
# 发布 Tag（v*）：tag_push 为仓库级事件置于兜底分支，经 v* 守卫仅对版本标签生效
# ------------------------------------------------------------
"$":
  tag_push:
    - name: release-check
      docker:
        image: node:24
      services:
        - docker
      stages:
        - name: 9-秘密扫描
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: |
            set -e
            if ! command -v gitleaks >/dev/null 2>&1; then
              curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
              tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
            fi
            gitleaks detect --source . --no-banner --redact
        - name: 11-文档链接一致性
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: |
            bash scripts/ci/check-docs-links.sh
        - name: 1-安装
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: |
            # 通过 corepack 使用与 package.json packageManager 匹配的 pnpm 版本
            corepack pnpm install --frozen-lockfile
        - name: 2-类型检查
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run typecheck
        - name: 3-Lint
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run lint
        - name: 3-格式
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run format:check
        - name: 4-单元测试L1
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run test:unit
        - name: 5-集成测试L2
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: |
            set -e
            docker run -d --name pg18-ci \
              -e POSTGRES_PASSWORD=ci \
              -e POSTGRES_DB=ranaminder_test \
              -p 5432:5432 \
              postgres:18
            trap 'docker rm -f pg18-ci >/dev/null 2>&1 || true' EXIT
            for i in $(seq 1 30); do
              if docker exec pg18-ci pg_isready -U postgres -d ranaminder_test >/dev/null 2>&1; then
                break
              fi
              sleep 2
              if [ "$i" = 30 ]; then
                echo "PG18 未在预期时间内就绪，容器日志："
                docker logs pg18-ci
                exit 1
              fi
            done
            docker exec pg18-ci psql -U postgres -d ranaminder_test -v ON_ERROR_STOP=1 \
              -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS btree_gist;'
            export CI=true
            npm run test:integration
        - name: 6-契约测试L3
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: npm run test:contract
        - name: 7-构建
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ]'
          script: |
            npm run build
            npm run build:worker
        # 阶段 8：镜像构建并推送（Tag 即版本号，非 latest）
        - name: 8-镜像构建推送
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ] && [ -f Dockerfile ]'
          script: |
            docker build -t ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_BRANCH} .
            docker push ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_BRANCH}
        # 阶段 8b：发布镜像安全扫描（trivy；HIGH/CRITICAL 失败即阻断发布，DEP-003 / SRS-NFR-022/023 / OPS-REL）
        - name: 8b-镜像安全扫描
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ] && [ -f Dockerfile ]'
          script: |
            set -e
            if ! command -v trivy >/dev/null 2>&1; then
              curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.69.3
            fi
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_BRANCH}
        # 阶段 8c：发布镜像 SBOM 生成（DEP-003 第三方依赖/许可证清单，发布门证据归档）
        - name: 8c-镜像SBOM生成
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f package.json ] && [ -f Dockerfile ]'
          script: |
            set -e
            if ! command -v syft >/dev/null 2>&1; then
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | bash -s -- -b /usr/local/bin
            fi
            syft ${CNB_DOCKER_REGISTRY}/ranaminder-service:${CNB_BRANCH} -o spdx-json > /tmp/ranaminder-sbom.spdx.json
            echo "发布镜像 SBOM 已生成（spdx-json），许可证复核见阶段 10 与发布门证据摘要。"
            wc -c /tmp/ranaminder-sbom.spdx.json
        - name: 10-依赖审计与许可证登记
          if: '[[ "$CNB_BRANCH" == v* ]] && [ -f pnpm-lock.yaml ]'
          script: |
            # 通过 corepack 使用与 package.json packageManager 匹配的 pnpm 版本（同阶段 1）
            corepack pnpm audit --audit-level=high
            bash scripts/ci/check-license-registry.sh
      endStages:
        # 发布门证据摘要（CI-004）：人工门由治理流程控制，CI 只输出证据供归档
        - name: 发布门证据摘要
          if: '[[ "$CNB_BRANCH" == v* ]]'
          script: |
            echo "=== 发布门证据（CI-004）==="
            echo "1) 首批技术验证清单 38 项（TVER-*）：人工门，见 docs/engineering/首批技术验证清单-v1.0.md"
            echo "2) 测试规格执行（306 转换底线、TST-FAIL/NFR/SEC）：人工门，见 docs/specification/测试规格与验收追踪-v1.0.md"
            echo "3) OPS-VER-001~024 部署/升级/恢复演练：人工门，见 docs/operations/部署运维与恢复手册-v1.0.md"
            echo "4) 生产 DDL 与迁移评审：人工门"
            echo "5) 秘密扫描/依赖审计/许可证：本流水线已执行（上方阶段日志即证据）"
            echo "6) 镜像与版本锁定（非 latest）：本流水线已执行（阶段 8 日志即证据）"
            echo "7) 镜像安全扫描（trivy HIGH/CRITICAL 失败门）：本流水线已执行（阶段 8b 日志即证据）"
            echo "8) 镜像 SBOM（第三方依赖/许可证清单，DEP-003）：本流水线已生成（阶段 8c 日志即证据）"
