# ============================================================
# RanaMinder 开发环境依赖服务编排（开发专用，端口与生产不同）
# 权威依据：docs/engineering/开发环境搭建指南-v1.0.md §2
# 生产拓扑见 docs/operations/部署运维与恢复手册-v1.0.md §13（另行收口）
#
# 用法：docker compose -f docker-compose.dev.yml up -d
# 说明：本编排只承载依赖服务（PostgreSQL/MinIO/Casdoor/Mailpit）；
#       应用与 worker 在宿主机以 npm run start:dev / start:worker:dev 运行
#       （开发指南 §4），镜像形态见 docs/engineering/Docker镜像构建规范-v1.0.md
# ============================================================
name: ranaminder-dev

services:
  postgres:
    image: postgres:18
    container_name: ranaminder-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: ranaminder_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化自动执行扩展脚本（pg_trgm / btree_gist）
      - ./scripts/dev/postgres-init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ranaminder_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # 开发用 latest；生产必须锁定 tag（依赖与版本基线 §2）
    image: minio/minio:latest
    container_name: ranaminder-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev-minio
      MINIO_ROOT_PASSWORD: dev-only-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      # minio/minio 镜像内置 curl（官方 compose 示例同款探针）
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  casdoor:
    image: casbin/casdoor:v3.108.0
    container_name: ranaminder-dev-casdoor
    ports:
      - "8000:8000"
    # 种子导入：Organization/Group 用虚构学校数据（开发指南 §2），
    # 禁止真实数据；验证 Claims/Group 读写/写后可见性（TVER-A-* 靶场）
    healthcheck:
      # casbin/casdoor 镜像基于 alpine（busybox wget）；如镜像变更导致探针
      # 不可用，改为进程探针并同步本文件注释
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: ranaminder-dev-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
